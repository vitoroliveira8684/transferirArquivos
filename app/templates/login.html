<!DOCTYPE html>
<html>
<head>
    <title>Login - Upload de Arquivos</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Ajuste específico para centralizar o box de login */
        .loginContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 50px;
        }
        .loginBox {
            background: rgb(255, 80, 47);
            padding: 30px;
            border-radius: 10px;
            color: white;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .loginBox input {
            padding: 10px;
            border-radius: 5px;
            border: none;
        }
        .btnLogin {
            padding: 10px;
            background: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: rgb(255, 80, 47);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="lblUploadArquivo">Login</h1>
        <img src="/static/img/atacadaoLogo.png" class="logo">
    </div>

    <div class="loginContainer">
        <form action="/login" method="post" class="loginBox">
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit" class="btnLogin">Entrar</button>
        </form>
    </div>

</body>
</html>

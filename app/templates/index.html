<!DOCTYPE html>
<html>



<head>
    <title>Upload de Arquivos</title>

    <link rel="stylesheet" href="/static/css/style.css">


</head>

<body>

    <div class="header">

        <h1 class="lblUploadArquivo">Upload de Arquivo</h1>
        <img src="/static/img/atacadaoLogo.png" class="logo">


    </div>
    <div class="uploadBox" id="dropZone">


        <form action="/upload" method="post" enctype="multipart/form-data" id="uploadForm">
            <input type="file" name="files" class="btnInput" id="fileInput" multiple>
            <button type="submit" class="btnSend">Enviar</button>
            <p id="fileStatus" class="fileStatus">Ou arraste arquivos / cole (Ctrl + v) aqui</p>
        </form>
    </div>

    <div class="cards">
        {% for arquivo in arquivos %}


        <div class="card">
            <div class="preview">
                <iframe src="/uploads/{{arquivo}}" title="Preview"></iframe>
            </div>
            <div class="info">
                <div class="filename" title="{{arquivo}}">{{arquivo}}</div>
                <div class="actions">
                    <a class="btnDownload" href="/uploads/{{arquivo}}" download>Baixar</a>
                    <form action="/delete/{{arquivo}}" method="post" style="margin:0;">
                        <button type="submit" class="btnDelete">Remover</button>
                    </form>
                </div>
            </div>
        </div>


        {% endfor %}
    </div>

    <script src="/static/js/upload.js"></script>

</body>




</html>
